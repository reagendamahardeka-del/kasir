/* ═══ ESC/POS CONTROLLER ═══ */
const ESC=0x1B,GS=0x1D;
function buildStruk(namaWarung,alamat,telp,trx){
  const W=32;
  const pad=(l,r)=>{const s=Math.max(1,W-String(l).length-String(r).length);return String(l)+' '.repeat(s)+String(r);};
  const chunks=[];
  const p=(...b)=>chunks.push(...b);
  p(new Uint8Array([ESC,0x40]));
  
  // Nama Warung
  p(new Uint8Array([ESC,0x61,1]),new Uint8Array([ESC,0x45,1]),new Uint8Array([GS,0x21,0x10]));
  p(new TextEncoder().encode(namaWarung + '\n'));
  p(new Uint8Array([GS,0x21,0x00]),new Uint8Array([ESC,0x45,0])); // Reset ukuran & bold
  
  // Alamat & Telp (Ditampilkan penuh tanpa substring yang memotong teks)
  if(alamat) p(new TextEncoder().encode(alamat + '\n'));
  if(telp) p(new TextEncoder().encode('Telp: ' + telp + '\n'));
  
  p(new Uint8Array([ESC,0x61,0])); // Left align
  p(new TextEncoder().encode('-'.repeat(W)+'\n'));
  const tglJam='Tgl: '+trx.tgl+'  '+trx.jam;
  p(new TextEncoder().encode(tglJam.substring(0,W)+'\n'));
  p(new TextEncoder().encode('No : #'+String(trx.id).slice(-5)+'\n'));
  p(new TextEncoder().encode('-'.repeat(W)+'\n'));
  trx.items.forEach(i=>{
    p(new TextEncoder().encode(i.nama.substring(0,W)+'\n'));
    p(new TextEncoder().encode(pad(`  ${i.qty} x ${rp(i.harga)}`,rp(i.harga*i.qty))+'\n'));
  });
  p(new TextEncoder().encode('='.repeat(W)+'\n'));
  p(new TextEncoder().encode(pad('Subtotal:', 'Rp '+rp(trx.subtotal))+'\n'));
  if(trx.diskon > 0) p(new TextEncoder().encode(pad('Diskon:', '-Rp '+rp(trx.diskon))+'\n'));
  p(new Uint8Array([ESC,0x45,1]));
  p(new TextEncoder().encode(pad('TOTAL:', 'Rp '+rp(trx.total))+'\n'));
  p(new Uint8Array([ESC,0x45,0]));
  p(new TextEncoder().encode(pad(`Bayar (${trx.metode}):`, 'Rp '+rp(trx.bayar))+'\n'));
  p(new TextEncoder().encode(pad('Kembali:', 'Rp '+rp(trx.kembali))+'\n'));
  p(new TextEncoder().encode('-'.repeat(W)+'\n'));
  p(new Uint8Array([ESC,0x61,1]));
  p(new TextEncoder().encode('Terima kasih sudah mampir!\n'));  p(new TextEncoder().encode('Semoga sehat selalu :)\n'));
  p(new Uint8Array([ESC,0x64,4]));
  p(new Uint8Array([GS,0x56,0x41,0x10]));
  const total=chunks.reduce((s,c)=>s+c.length,0);
  const buf=new Uint8Array(total);let off=0;
  chunks.forEach(c=>{buf.set(c,off);off+=c.length;});
  return buf;
}

const BLE_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','0000e001-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','6e400001-b5a3-f393-e0a9-e50e24dcca9e'];
class PrinterMgr{
  constructor(){this.dev=null;this.ch=null;this.mtu=100;}
  ok(){return!!this.ch;}
  async connect(onProgress){
    if(!navigator.bluetooth)throw new Error('Browser tidak mendukung Bluetooth. Gunakan Chrome.');
    // Sertakan Device Information Service (0x180A) agar bisa baca nama dari GATT
    const allServices=[...BLE_SERVICES,'0000180a-0000-1000-8000-00805f9b34fb'];
    if(onProgress) onProgress('Pilih printer dari daftar...');
    const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:allServices});
    if(onProgress) onProgress('Menghubungkan ke '+( dev.name||'perangkat')+'...');
    const srv=await dev.gatt.connect();
    dev.addEventListener('gattserverdisconnected',()=>{this.dev=null;this.ch=null;});
    let ch=null;
    try{
      const svcs=await srv.getPrimaryServices();
      for(const s of svcs){try{const cs=await s.getCharacteristics();for(const c of cs){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break;}}if(ch)break;}catch{}}
    }catch{}
    if(!ch)throw new Error('Karakteristik printer tidak ditemukan.');
    this.dev=dev;this.ch=ch;
    // Coba baca nama dari Device Information Service jika device.name null
    let devName = dev.name || '';
    if(!devName){
      try{
        const diSvc = await srv.getPrimaryService('0000180a-0000-1000-8000-00805f9b34fb');
        const nameChar = await diSvc.getCharacteristic('00002a00-0000-1000-8000-00805f9b34fb');
        const val = await nameChar.readValue();
        devName = new TextDecoder().decode(val);
      }catch(e){}
    }
    // Fallback: gunakan sebagian device.id atau label generik
    if(!devName) devName = dev.id ? 'BT-'+dev.id.substring(0,6).toUpperCase() : 'EPOS-Printer';
    this.devName = devName;
    return devName;
  }
  async send(buf){
    if(!this.ch)throw new Error('Printer belum terhubung');
    for(let i=0;i<buf.length;i+=this.mtu){
      const chunk=buf.slice(i,i+this.mtu);
      if(this.ch.properties.writeWithoutResponse)await this.ch.writeValueWithoutResponse(chunk);
      else await this.ch.writeValue(chunk);
      await new Promise(r=>setTimeout(r,20));
    }
  }
  async disconnect(){if(this.dev?.gatt?.connected)await this.dev.gatt.disconnect();this.dev=null;this.ch=null;}
}
const printer=new PrinterMgr();

function cetakCss(namaWarung,alamat,telp,trx){
  let h=`<div style="text-align:center;font-weight:bold;font-size:14px;font-weight:900;margin-bottom:2px">${namaWarung}</div>`;
  // Menghapus batas font-size kecil (8px) agar kontras terlihat jelas saat dicetak via browser/PDF
  if(alamat) h+=`<div style="text-align:center;font-size:11px;line-height:1.2">${alamat}</div>`;
  if(telp) h+=`<div style="text-align:center;font-size:11px;">Telp: ${telp}</div>`;
  h+=`<div>${'-'.repeat(32)}</div>`;
  h+=`<div style="font-size:10px">Tgl: ${trx.tgl}  Jam: ${trx.jam}</div>`;
  h+=`<div style="font-size:10px">No : #${String(trx.id).slice(-5)}</div>`;
  h+=`<div>${'-'.repeat(32)}</div>`;
  trx.items.forEach(i=>{
    h+=`<div style="font-size:11px">${i.nama}</div>`;
    h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span style="padding-left:8px">${i.qty} x ${rp(i.harga)}</span><span>${rp(i.harga*i.qty)}</span></div>`;
  });
  h+=`<div>${'='.repeat(32)}</div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span>Subtotal</span><span>Rp ${rp(trx.subtotal)}</span></div>`;
  if(trx.diskon > 0) h+=`<div style="display:flex;justify-content:space-between;font-size:11px;color:#000"><span>Diskon</span><span>-Rp ${rp(trx.diskon)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-weight:bold;font-size:11px"><span>TOTAL</span><span>Rp ${rp(trx.total)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span>Bayar (${trx.metode})</span><span>Rp ${rp(trx.bayar)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span>Kembali</span><span>Rp ${rp(trx.kembali)}</span></div>`;
  h+=`<div>${'-'.repeat(32)}</div>`;
  h+=`<div style="text-align:center;font-size:10px">Terima kasih sudah mampir!</div>`;
  h+=`<div style="text-align:center;font-size:10px">Semoga sehat selalu :)</div><br><br><br>`;
  document.getElementById('struk-print').innerHTML=h;
  setTimeout(()=>window.print(),200);
}

function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

/* ═══════════════ MAIN APP ═══════════════ */
function App(){
  const[tab,setTab]=useState('kasir');
  const[namaWarung,setNamaWarung]=useState(()=>localStorage.getItem('wg_nama_v10')||'Kedai Selada Air');
  const[alamatWarung,setAlamatWarung]=useState(()=>localStorage.getItem('wg_alamat_v10')||'');
  const[telpWarung,setTelpWarung]=useState(()=>localStorage.getItem('wg_telp_v10')||'');
  
  const[menu,setMenu]=useState(()=>ls('wg_menu_v10',MENU_DEFAULT));
  const[cart,setCart]=useState([]);
  const[transaksi,setTransaksi]=useState(()=>ls('wg_trx_v10',[]));
  const[pengeluaran,setPengeluaran]=useState(()=>ls('wg_pgl_v10',[]));
  
  const[bayar,setBayar]=useState('');
  const[diskonInput,setDiskonInput]=useState(''); 
  const[metodeBayar,setMetodeBayar]=useState('Cash'); 
  
  const[cartModal,setCartModal]=useState(null);
  const[toast,setToast]=useState('');
  const[printerSt,setPrinterSt]=useState('off');
  const[printerName,setPrinterName]=useState('');
  const toastRef=useRef();

  useEffect(()=>{lsSet('wg_menu_v10',menu);},[menu]);
  useEffect(()=>{lsSet('wg_trx_v10',transaksi);},[transaksi]);
  useEffect(()=>{lsSet('wg_pgl_v10',pengeluaran);},[pengeluaran]);
  useEffect(()=>{
    localStorage.setItem('wg_nama_v10',namaWarung);
    localStorage.setItem('wg_alamat_v10',alamatWarung);
    localStorage.setItem('wg_telp_v10',telpWarung);
  },[namaWarung,alamatWarung,telpWarung]);

  const showMsg=useCallback((m)=>{
    clearTimeout(toastRef.current);setToast(m);
    toastRef.current=setTimeout(()=>setToast(''),2800);
  },[]);

  const keCart=useCallback((item)=>setCart(p=>{
    const ada=p.find(i=>i.id===item.id);
    return ada?p.map(i=>i.id===item.id?{...i,qty:i.qty+1}:i):[...p,{...item,qty:1}];
  }),[]);
  
  const ubahQty=useCallback((id,d)=>setCart(p=>p.map(i=>i.id===id?{...i,qty:i.qty+d}:i).filter(i=>i.qty>0)),[]);
  
  const subtotalHarga=useMemo(()=>cart.reduce((s,i)=>s+i.harga*i.qty,0),[cart]);
  const totalQty=useMemo(()=>cart.reduce((s,i)=>s+i.qty,0),[cart]);

  const hitungDiskon=useMemo(()=> {
    if(!diskonInput) return 0;
    if(diskonInput.includes('%')) {
      const persen = parseFloat(diskonInput.replace('%','')) || 0;
      return Math.round((persen / 100) * subtotalHarga);
    }
    return parseInt(diskonInput) || 0;
  }, [diskonInput, subtotalHarga]);

  const totalHargaAkhir = useMemo(()=> Math.max(0, subtotalHarga - hitungDiskon), [subtotalHarga, hitungDiskon]);

  const hubungkanPrinter=async()=>{
    if(printerSt==='on'){
      await printer.disconnect();
      setPrinterSt('off');setPrinterName('');
      showMsg('🔌 Printer diputus');return;
    }
    setPrinterSt('connecting');
    try{
      const nm=await printer.connect((prog)=>showMsg('🔵 '+prog));
      setPrinterSt('on');
      setPrinterName(nm);
      showMsg('✅ Terhubung: '+nm);
    }catch(e){
      setPrinterSt('off');
      // Tampilkan pesan error yang lebih jelas
      if(e.message && e.message.includes('User cancelled')){
        showMsg('⚠️ Pilihan dibatalkan');
      } else {
        showMsg('❌ '+e.message);
      }
    }
  };

  const eksekusiBayar=async()=>{
    const nb=metodeBayar === 'QRIS' ? totalHargaAkhir : (parseInt(bayar)||0);
    if(nb < totalHargaAkhir){showMsg('⚠️ Uang bayar kurang!');return;}
    
    const trx={
      id:Date.now(),
      tgl:tgl(),
      jam:jam(),
      items:cart.map(i=>({...i})),
      subtotal:subtotalHarga,
      diskon:hitungDiskon,
      total:totalHargaAkhir,
      bayar:nb,
      kembali:nb-totalHargaAkhir,
      metode:metodeBayar
    };
    
    setTransaksi(p=>[trx,...p]);
    setCart([]);setCartModal(null);setBayar('');setDiskonInput('');setMetodeBayar('Cash');
    
    if(printer.ok()){
      try{await printer.send(buildStruk(namaWarung,alamatWarung,telpWarung,trx));showMsg('🖨️ Struk dicetak!');}
      catch(e){showMsg('⚠️ Cetak via browser');cetakCss(namaWarung,alamatWarung,telpWarung,trx);}
    }else{cetakCss(namaWarung,alamatWarung,telpWarung,trx);showMsg('✅ Transaksi sukses!');}
  };

  const verifikasiAksesAdmin=(aksiSukses)=>{
    const inputPin = prompt("🔒 Masukkan PIN Keamanan Owner/Admin untuk menghapus data:");
    if(inputPin === PIN_ADMIN){
      aksiSukses();
    }else if(inputPin !== null){
      alert("❌ PIN Salah! Akses ditolak. Pembatalan dicatat.");
    }
  };

  const ulangCetak=(trx)=>{
    if(printer.ok()){printer.send(buildStruk(namaWarung,alamatWarung,telpWarung,trx)).catch(()=>cetakCss(namaWarung,alamatWarung,telpWarung,trx));}
    else cetakCss(namaWarung,alamatWarung,telpWarung,trx);
  };

  // Tampilkan nama device BT secara lengkap (maks 20 char) agar mudah identifikasi di tablet
  const namaBt=printerName ? printerName.substring(0,20) : 'ON';
  const btnP={
    off:       {bg:'rgba(255,255,255,0.18)',lbl:'🔌 Hubungkan Printer'},
    connecting:{bg:'#f59e0b',              lbl:'⏳ Menghubungkan...'},
    on:        {bg:'#22c55e',              lbl:'🖨️ '+namaBt},
  }[printerSt] || {bg:'rgba(255,255,255,0.18)',lbl:'🔌 Hubungkan Printer'};

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* HEADER */}
      <div style={{background:'linear-gradient(135deg,#ea580c,#c2410c)',padding:'12px 16px',color:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div>
          <div style={{fontSize:'16px',fontWeight:800,lineHeight:1.1}}>{namaWarung}</div>
          <div style={{fontSize:'10px',opacity:0.8,marginTop:2}}>{tgl()} · Sistem v10 Tab-Ready</div>
        </div>
        <button onClick={hubungkanPrinter} disabled={printerSt==='connecting'}
          style={{background:btnP.bg,border:'1px solid rgba(255,255,255,0.3)',padding:'7px 14px',borderRadius:'20px',color:'#fff',fontSize:'11px',fontWeight:700,cursor:'pointer',maxWidth:'200px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',transition:'all .2s'}}>
          {btnP.lbl}
        </button>
      </div>

      {/* TAB NAVIGATION */}
      <div style={{display:'flex',background:'#fff',borderBottom:'1px solid #e2e8f0',flexShrink:0}}>
        {[{id:'kasir',l:'🍽️ Kasir'},{id:'laporan',l:'📊 Laporan'},{id:'menu',l:'📋 Menu'},{id:'setting',l:'⚙️ Pengaturan'}].map(t=>(
          <div key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'12px 4px',textAlign:'center',fontSize:'12px',fontWeight:700,cursor:'pointer',borderBottom:tab===t.id?'3px solid #ea580c':'3px solid transparent',color:tab===t.id?'#ea580c':'#94a3b8',transition:'all .15s'}}>
            {t.l}
          </div>
        ))}
      </div>

      {/* BODY CONTENT */}
      <div style={{flex:1,overflowY:'auto',position:'relative'}}>
        {tab==='kasir'&&<TabKasir menu={menu} cart={cart} keCart={keCart} ubahQty={ubahQty} totalHarga={totalHargaAkhir} subtotal={subtotalHarga} diskon={hitungDiskon} totalQty={totalQty} setCartModal={setCartModal}/>}
        {tab==='laporan'&&<TabLaporan transaksi={transaksi} setTransaksi={setTransaksi} pengeluaran={pengeluaran} setPengeluaran={setPengeluaran} ulangCetak={ulangCetak} showMsg={showMsg} proteksi={verifikasiAksesAdmin}/>}
        {tab==='menu'&&<TabMenu menu={menu} setMenu={setMenu} showMsg={showMsg}/>}
        {tab==='setting'&&<TabSetting namaWarung={namaWarung} setNamaWarung={setNamaWarung} alamatWarung={alamatWarung} setAlamatWarung={setAlamatWarung} telpWarung={telpWarung} setTelpWarung={setTelpWarung} transaksi={transaksi} setTransaksi={setTransaksi} pengeluaran={pengeluaran} setPengeluaran={setPengeluaran} showMsg={showMsg} proteksi={verifikasiAksesAdmin}/>}
      </div>

      {/* ── MODAL REVIEW ORDER ── */}
      {cartModal==='review'&&(
        <div style={{position:'absolute',inset:0,background:'rgba(15,23,42,0.65)',display:'flex',alignItems:'flex-end',zIndex:99,animation:'fadeIn .2s ease'}}>
          <div style={{background:'#fff',width:'100%',borderRadius:'24px 24px 0 0',padding:'20px',maxHeight:'85%',display:'flex',flexDirection:'column',animation:'slideUp .25s ease'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <span style={{fontWeight:800,fontSize:15}}>📋 Rincian Pesanan Meja</span>
              <button onClick={()=>setCartModal(null)} style={{background:'#f1f5f9',border:'none',borderRadius:20,padding:'5px 12px',cursor:'pointer',fontWeight:700,fontSize:12}}>✕ Tutup</button>
            </div>
            <div style={{flex:1,overflowY:'auto',marginBottom:12}}>
              {cart.map(i=>(
                <div key={i.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 0',borderBottom:'1px solid #f1f5f9'}}>
                  <span style={{fontSize:20}}>{i.emoji}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:700}}>{i.nama}</div>
                    <div style={{fontSize:11,color:'#64748b'}}>Rp {rp(i.harga)} × {i.qty}</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                    <button onClick={()=>ubahQty(i.id,-1)} style={{width:24,height:24,borderRadius:12,border:'none',background:'#fee2e2',color:'#dc2626',fontWeight:800,cursor:'pointer'}}>−</button>
                    <span style={{fontWeight:800,fontSize:13}}>{i.qty}</span>
                    <button onClick={()=>ubahQty(i.id,1)} style={{width:24,height:24,borderRadius:12,border:'none',background:'#ea580c',color:'#fff',fontWeight:800,cursor:'pointer'}}>+</button>
                  </div>
                  <span style={{fontWeight:700,fontSize:13,minWidth:65,textAlign:'right'}}>Rp {rp(i.harga*i.qty)}</span>
                </div>
              ))}
            </div>
            <div style={{background:'#fff7ed',borderRadius:12,padding:12,marginBottom:12,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div>
                <div style={{fontSize:11,color:'#94a3b8',fontWeight:600}}>SUBTOTAL ({totalQty} ITEM)</div>
                <div style={{fontSize:16,fontWeight:800,color:'#ea580c'}}>Rp {rp(subtotalHarga)}</div>
              </div>
              <button onClick={()=>{setCart([]);setCartModal(null);showMsg('🗑️ Pesanan dibersihkan');}} style={{padding:'6px 12px',background:'#fee2e2',border:'none',borderRadius:10,color:'#dc2626',fontSize:11,fontWeight:700,cursor:'pointer'}}>🗑️ Kosongkan</button>
            </div>
            <button onClick={()=>setCartModal('bayar')} style={{width:'100%',padding:'12px',background:'linear-gradient(135deg,#ea580c,#c2410c)',color:'#fff',border:'none',borderRadius:12,fontWeight:800,fontSize:13,cursor:'pointer'}}>
              ➔ Lanjut Memilih Pembayaran
            </button>
          </div>
        </div>
      )}

      {/* ── MODAL PROSES PEMBAYARAN & DISKON ── */}
      {cartModal==='bayar'&&(
        <div style={{position:'absolute',inset:0,background:'rgba(15,23,42,0.65)',display:'flex',alignItems:'flex-end',zIndex:99,animation:'fadeIn .2s ease'}}>
          <div style={{background:'#fff',width:'100%',borderRadius:'24px 24px 0 0',padding:'20px',maxHeight:'85%',display:'flex',flexDirection:'column',animation:'slideUp .25s ease'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
              <span style={{fontWeight:800,fontSize:15}}>💳 Selesaikan Transaksi</span>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>setCartModal('review')} style={{background:'#f1f5f9',border:'none',borderRadius:20,padding:'5px 12px',cursor:'pointer',fontWeight:700,fontSize:11}}>← Kembali</button>
                <button onClick={()=>{setCartModal(null);setBayar('');setDiskonInput('');}} style={{background:'#f1f5f9',border:'none',borderRadius:20,padding:'5px 12px',cursor:'pointer',fontWeight:700,fontSize:11}}>✕</button>
              </div>
            </div>

            <div style={{background:'#f8fafc',borderRadius:12,padding:10,marginBottom:10,border:'1px solid #e2e8f0',fontSize:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,color:'#64748b'}}>
                <span>Subtotal:</span><span>Rp {rp(subtotalHarga)}</span>
              </div>
              {hitungDiskon > 0 && (
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,color:'#dc2626',fontWeight:600}}>
                  <span>Potongan Diskon:</span><span>-Rp {rp(hitungDiskon)}</span>
                </div>
              )}
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:800,fontSize:15,color:'#ea580c',paddingTop:4,borderTop:'1px dashed #e2e8f0'}}>
                <span>Total Bersih:</span><span>Rp {rp(totalHargaAkhir)}</span>
              </div>
            </div>

            <label style={{fontSize:11,color:'#64748b',fontWeight:700,marginBottom:4}}>METODE PEMBAYARAN</label>
            <div style={{display:'flex',gap:8,marginBottom:10}}>
              {['Cash','QRIS'].map(m=>(
                <button key={m} onClick={()=>setMetodeBayar(m)} style={{flex:1,padding:'10px',borderRadius:10,fontWeight:800,fontSize:12,cursor:'pointer',border:metodeBayar===m?'2px solid #ea580c':'1px solid #e2e8f0',background:metodeBayar===m?'#fff7ed':'#fff',color:metodeBayar===m?'#ea580c':'#64748b'}}>
                  {m === 'Cash' ? '💵 Uang Tunai (Cash)' : '📱 Scan QRIS'}
                </button>
              ))}
            </div>

            <label style={{fontSize:11,color:'#64748b',fontWeight:700,marginBottom:4}}>DISKON / POTONGAN (CONTOH: 10% ATAU 5000)</label>
            <input type="text" value={diskonInput} onChange={e=>setDiskonInput(e.target.value)} placeholder="Kosongkan jika tidak ada diskon..."
              style={{width:'100%',padding:'10px',borderRadius:8,border:'1px solid #e2e8f0',fontSize:13,outline:'none',fontFamily:'Plus Jakarta Sans',marginBottom:10,fontWeight:600}}/>

            {/* Form Input Tunai */}
            {metodeBayar === 'Cash' && (
              <>
                <label style={{fontSize:11,color:'#64748b',fontWeight:700,marginBottom:4}}>NOMINAL TUNAI YANG DITERIMA</label>
                <input type="number" value={bayar} onChange={e=>setBayar(e.target.value)} placeholder="Masukkan uang cash..."
                  style={{width:'100%',padding:'10px',borderRadius:8,border:'2px solid #e2e8f0',fontSize:14,fontWeight:700,outline:'none',marginBottom:8}}/>
                <div style={{display:'flex',gap:4,marginBottom:10,flexWrap:'wrap'}}>
                  {[10000,20000,50000,100000].map(n=>(
                    <button key={n} onClick={()=>setBayar(String(n))} style={{padding:'4px 8px',borderRadius:8,border:'1px solid #e2e8f0',background:'#fff',fontSize:11,fontWeight:700,cursor:'pointer'}}>
                      {rp(n)}
                    </button>
                  ))}
                </div>
                {parseInt(bayar)>=totalHargaAkhir && bayar && (
                  <div style={{display:'flex',justifyContent:'space-between',color:'#16a34a',fontWeight:700,fontSize:12,padding:'8px 10px',background:'#f0fdf4',borderRadius:8,marginBottom:10}}>
                    <span>Kembalian Kasir:</span><span>Rp {rp(parseInt(bayar)-totalHargaAkhir)}</span>
                  </div>
                )}
              </>
            )}

            <button onClick={eksekusiBayar} style={{width:'100%',padding:'12px',background:'linear-gradient(135deg,#22c55e,#16a34a)',color:'#fff',border:'none',borderRadius:12,fontWeight:800,fontSize:13,cursor:'pointer'}}>
              🖨️ Cetak & Selesaikan Struk Nota
            </button>
          </div>
        </div>
      )}

      {/* NOTIFIKASI TOAST */}
      {toast&&<div style={{position:'absolute',top:20,left:'50%',transform:'translateX(-50%)',background:'#1e293b',color:'#fff',padding:'8px 16px',borderRadius:20,fontSize:12,fontWeight:700,zIndex:999,whiteSpace:'nowrap',animation:'toastIn .2s ease'}}>{toast}</div>}
    </div>
  );
}

/* ═══ TAB KASIR (GRID KULINER) ═══ */
function TabKasir({menu,cart,keCart,ubahQty,totalHarga,subtotal,diskon,totalQty,setCartModal}){
  const[kat,setKat]=useState('Semua');
  const[q,setQ]=useState('');
  const filtered=useMemo(()=>menu.filter(m=>(kat==='Semua'||m.kat===kat)&&m.nama.toLowerCase().includes(q.toLowerCase())),[menu,kat,q]);

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{padding:'10px 14px 4px'}}>
        <div style={{display:'flex',alignItems:'center',background:'#fff',borderRadius:10,padding:'6px 12px',gap:8,border:'1px solid #e2e8f0'}}>
          <span>🔍</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari nama kuliner..."
            style={{border:'none',outline:'none',fontSize:12,fontFamily:'Plus Jakarta Sans',flex:1,fontWeight:600}}/>
        </div>
      </div>
      <div style={{display:'flex',gap:6,padding:'4px 14px 8px',overflowX:'auto',flexShrink:0}}>
        {KATEGORI.map(k=>(
          <button key={k} onClick={()=>setKat(k)} style={{padding:'5px 12px',borderRadius:16,border:'1px solid #e2e8f0',fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',background:kat===k?WARNA_KAT[k]||'#ea580c':'#fff',color:kat===k?'#fff':'#94a3b8'}}>
            {k}
          </button>
        ))}
      </div>
      
      <div style={{flex:1,overflowY:'auto',padding:'0 14px 20px'}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(130px, 1fr))',gap:10}}>
          {filtered.map(item=>{
            const inCart=cart.find(c=>c.id===item.id);
            return(
              <div key={item.id} onClick={()=>keCart(item)} style={{background:'#fff',padding:12,borderRadius:14,boxShadow:'0 2px 6px rgba(0,0,0,0.04)',cursor:'pointer',border:'1px solid #e2e8f0',position:'relative'}}>
                <div style={{fontSize:24,marginBottom:2}}>{item.emoji}</div>
                <div style={{fontSize:9,color:WARNA_KAT[item.kat]||'#ea580c',fontWeight:800,textTransform:'uppercase'}}>{item.kat}</div>
                <div style={{fontSize:12,fontWeight:700,color:'#1e293b',lineHeight:1.2,minHeight:28,marginTop:2}}>{item.nama}</div>
                <div style={{fontSize:12,fontWeight:800,color:'#ea580c',marginTop:4}}>Rp {rp(item.harga)}</div>
                {inCart&&<div style={{position:'absolute',top:6,right:6,background:'#ea580c',color:'#fff',width:18,height:18,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:900}}>{inCart.qty}</div>}
              </div>
            );
          })}
        </div>
        {cart.length > 0 && <div style={{height:'150px'}} />}
      </div>

      {/* BAR KERANJANG MELAYANG */}
      {cart.length>0&&(
        <div style={{position:'absolute',bottom:0,left:0,right:0,zIndex:50,padding:'10px 14px',background:'linear-gradient(to top,#f8fafc 80%,transparent)'}}>
          <div style={{background:'#fff',borderRadius:14,boxShadow:'0 -4px 15px rgba(0,0,0,0.08)',marginBottom:6,padding:10,maxHeight:90,overflowY:'auto',border:'1px solid #e2e8f0'}}>
            {cart.map(i=>(
              <div key={i.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',fontSize:11,padding:'3px 0',borderBottom:'1px solid #f8fafc'}}>
                <span style={{fontWeight:600,color:'#334155'}}>{i.emoji} {i.nama} (x{i.qty})</span>
                <span style={{fontWeight:700,color:'#ea580c'}}>Rp {rp(i.harga*i.qty)}</span>
              </div>
            ))}
          </div>
          <button onClick={()=>setCartModal('review')} style={{width:'100%',padding:'12px',background:'linear-gradient(135deg,#ea580c,#c2410c)',color:'#fff',border:'none',borderRadius:12,fontWeight:800,fontSize:13,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span>🛒 {totalQty} Item · Total: Rp {rp(totalHarga)}</span>
            <span>Konsep Pembayaran →</span>
          </button>
        </div>
      )}
    </div>
  );
}

/* ═══ TAB LAPORAN ═══ */
const KAT_PGL=['Bahan Baku','Operasional','Gaji','Lain-lain'];
function TabLaporan({transaksi,setTransaksi,pengeluaran,setPengeluaran,ulangCetak,showMsg,proteksi}){
  const[view,setView]=useState('hari');
  const[pglForm,setPglForm]=useState({ket:'',nominal:'',kat:'Bahan Baku'});
  const today=tgl();
  const todayTrx=useMemo(()=>transaksi.filter(t=>t.tgl===today),[transaksi,today]);
  const todayPgl=useMemo(()=>pengeluaran.filter(p=>p.tgl===today),[pengeluaran,today]);
  
  const omzet=todayTrx.reduce((s,t)=>s+t.total,0);
  const keluar=todayPgl.reduce((s,p)=>s+p.nominal,0);

  const simpanPgl=()=>{
    if(!pglForm.ket||!pglForm.nominal){showMsg('⚠️ Kolom belum lengkap!');return;}
    setPengeluaran(p=>[{id:Date.now(),tgl:today,jam:jam(),...pglForm,nominal:parseInt(pglForm.nominal)},...p]);
    setPglForm({ket:'',nominal:'',kat:'Bahan Baku'});
    showMsg('✅ Pengeluaran dicatat!');
    setView('rpgl');
  };

  const hapusTrx=(id)=>{
    proteksi(() => {
      if(!confirm('Apakah Owner yakin ingin membatalkan/menghapus riwayat penjualan ini?')) return;
      setTransaksi(p=>p.filter(t=>t.id!==id));
      showMsg('🗑️ Nota penjualan berhasil dihapus dari sistem');
    });
  };

  const hapusPgl=(id)=>{
    proteksi(() => {
      setPengeluaran(p=>p.filter(x=>x.id!==id));
      showMsg('🗑️ Catatan pengeluaran dihapus');
    });
  };

  return(
    <div style={{padding:14}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:10}}>
        {[{l:'Omzet',v:omzet,c:'#22c55e'},{l:'Keluar',v:keluar,c:'#ef4444'},{l:'Laba',v:omzet-keluar,c:(omzet-keluar)>=0?'#0ea5e9':'#ef4444'}].map(s=>(
          <div key={s.l} style={{background:'#fff',borderRadius:10,padding:'8px 4px',textAlign:'center',border:'1px solid #e2e8f0'}}>
            <div style={{fontSize:9,color:'#94a3b8',fontWeight:800}}>{s.l} HARI INI</div>
            <div style={{fontSize:11,fontWeight:800,color:s.c,marginTop:2}}>Rp {rp(s.v)}</div>
          </div>
        ))}
      </div>

      <div style={{display:'flex',background:'#fff',borderRadius:10,padding:3,gap:2,marginBottom:10,border:'1px solid #e2e8f0'}}>
        {[{id:'hari',l:'Riwayat Penjualan'},{id:'pgl',l:'+ Biaya'},{id:'rpgl',l:'Daftar Biaya'}].map(v=>(
          <button key={v.id} onClick={()=>setView(v.id)} style={{flex:1,padding:'6px 2px',border:'none',borderRadius:8,fontFamily:'Plus Jakarta Sans',fontSize:10,fontWeight:700,cursor:'pointer',background:view===v.id?'#ea580c':'transparent',color:view===v.id?'#fff':'#94a3b8'}}>
            {v.l}
          </button>
        ))}
      </div>

      {view==='hari'&&(
        <div style={{background:'#fff',borderRadius:12,padding:12,border:'1px solid #e2e8f0'}}>
          <div style={{fontWeight:800,fontSize:12,marginBottom:8}}>🧾 Daftar Nota Hari Ini ({todayTrx.length}x)</div>
          {!todayTrx.length?<div style={{textAlign:'center',color:'#cbd5e1',padding:20,fontSize:12}}>Belum ada transaksi keluar</div>:todayTrx.map(t=>(
            <div key={t.id} style={{padding:'8px 0',borderBottom:'1px solid #f8fafc'}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700}}>
                <span>No #${String(t.id).slice(-5)} ({t.metode})</span>
                <span style={{color:'#22c55e'}}>Rp {rp(t.total)}</span>
              </div>
              <div style={{fontSize:10,color:'#94a3b8',marginBottom:4}}>{t.jam} · Diskon: Rp {rp(t.diskon)}</div>
              <div style={{display:'flex',gap:4}}>
                <button onClick={()=>ulangCetak(t)} style={{flex:1,fontSize:10,padding:4,border:'1px solid #e2e8f0',borderRadius:6,background:'#fff',fontWeight:700,cursor:'pointer'}}>🖨️ Re-Print</button>
                <button onClick={()=>hapusTrx(t.id)} style={{flex:1,fontSize:10,padding:4,border:'1px solid #fecaca',borderRadius:6,background:'#fef2f2',color:'#ef4444',fontWeight:700,cursor:'pointer'}}>🔒 Hapus (Admin)</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {view==='pgl'&&(
        <div style={{background:'#fff',borderRadius:12,padding:12,border:'1px solid #e2e8f0'}}>
          <div style={{fontWeight:800,fontSize:12,marginBottom:8}}>📝 Tambah Pengeluaran Operasional</div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:8}}>
            {KAT_PGL.map(k=>(
              <button key={k} onClick={()=>setPglForm(p=>({...p,kat:k}))} style={{padding:'4px 8px',borderRadius:8,border:'none',fontSize:10,fontWeight:700,cursor:'pointer',background:pglForm.kat===k?'#ea580c':'#f1f5f9',color:pglForm.kat===k?'#fff':'#64748b'}}>
                {k}
              </button>
            ))}
          </div>
          <input value={pglForm.ket} onChange={e=>setPglForm(p=>({...p,ket:e.target.value}))} placeholder="Keterangan pengeluaran..."
            style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none',marginBottom:6}}/>
          <input type="number" value={pglForm.nominal} onChange={e=>setPglForm(p=>({...p,nominal:e.target.value}))} placeholder="Nominal biaya (Rp)"
            style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none',marginBottom:10}}/>
          <button onClick={simpanPgl} style={{width:'100%',padding:10,background:'#ea580c',border:'none',borderRadius:8,color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer'}}>💾 Simpan Data</button>
        </div>
      )}

      {view==='rpgl'&&(
        <div style={{background:'#fff',borderRadius:12,padding:12,border:'1px solid #e2e8f0'}}>
          <div style={{fontWeight:800,fontSize:12,marginBottom:6}}>📋 Catatan Pengeluaran</div>
          {!pengeluaran.length?<div style={{textAlign:'center',color:'#cbd5e1',padding:20}}>Kosong</div>:pengeluaran.map(p=>(
            <div key={p.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 0',borderBottom:'1px solid #f8fafc',fontSize:12}}>
              <div>
                <div style={{fontWeight:700}}>{p.ket}</div>
                <div style={{fontSize:9,color:'#94a3b8'}}>{p.tgl} · {p.kat}</div>
              </div>
              <div style={{display:'flex',alignItems:'center',gap:4}}>
                <span style={{fontWeight:800,color:'#ef4444'}}>−{rp(p.nominal)}</span>
                <button onClick={()=>hapusPgl(p.id)} style={{padding:'2px 6px',border:'none',background:'#fef2f2',color:'#ef4444',borderRadius:6,cursor:'pointer'}}>🗑️</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ═══ TAB DATA MENU KULINER ═══ */
function TabMenu({menu,setMenu,showMsg}){
  const[showForm,setShowForm]=useState(false);
  const[form,setForm]=useState({nama:'',harga:'',kat:'Nasi',emoji:'🍚'});
  const[editId,setEditId]=useState(null);
  const[filterK,setFilterK]=useState('Semua');

  const simpan=()=>{
    if(!form.nama||!form.harga){showMsg('⚠️ Nama/Harga kosong!');return;}
    if(editId){setMenu(p=>p.map(m=>m.id===editId?{...m,...form,harga:parseInt(form.harga)}:m));showMsg('✅ Diperbarui!');}
    else{setMenu(p=>[...p,{id:Date.now(),...form,harga:parseInt(form.harga)}]);showMsg('✅ Ditambahkan!');}
    setForm({nama:'',harga:'',kat:'Nasi',emoji:'🍚'});setEditId(null);setShowForm(false);
  };

  return(
    <div style={{padding:14}}>
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        <button onClick={()=>{setForm({nama:'',harga:'',kat:'Nasi',emoji:'🍚'});setEditId(null);setShowForm(!showForm);}}
          style={{flex:1,padding:10,background:'#ea580c',border:'none',borderRadius:10,color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer'}}>
          {showForm?'✕ Tutup Form':'＋ Buat Menu Baru'}
        </button>
        <button onClick={()=>{if(confirm('Reset semua daftar menu kembali ke awal?')){setMenu(MENU_DEFAULT);showMsg('↺ Reset sukses!');}}}
          style={{padding:10,background:'#fff',border:'1px solid #e2e8f0',borderRadius:10,color:'#64748b',fontSize:12,fontWeight:700,cursor:'pointer'}}>↺ Reset Awal</button>
      </div>

      {showForm&&(
        <div style={{background:'#fff',borderRadius:12,padding:12,marginBottom:10,border:'1px solid #e2e8f0'}}>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:8,maxHeight:60,overflowY:'auto',background:'#f8fafc',padding:4,borderRadius:8}}>
            {EMOJI_LIST.map(e=>(
              <span key={e} onClick={()=>setForm(p=>({...p,emoji:e}))} style={{fontSize:18,cursor:'pointer',padding:2,background:form.emoji===e?'#fee2e2':'transparent',borderRadius:4}}>
                {e}
              </span>
            ))}
          </div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:8}}>
            {KATEGORI.filter(k=>k!=='Semua').map(k=>(
              <button key={k} onClick={()=>setForm(p=>({...p,kat:k}))} style={{padding:'4px 8px',borderRadius:8,fontSize:10,fontWeight:700,background:form.kat===k?WARNA_KAT[k]:'#f1f5f9',color:form.kat===k?'#fff':'#64748b',border:'none',cursor:'pointer'}}>
                {k}
              </button>
            ))}
          </div>
          <input value={form.nama} onChange={e=>setForm(p=>({...p,nama:e.target.value}))} placeholder="Nama masakan/minuman..."
            style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none',marginBottom:6}}/>
          <input type="number" value={form.harga} onChange={e=>setForm(p=>({...p,harga:e.target.value}))} placeholder="Harga jual Rp..."
            style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none',marginBottom:8}}/>
          <button onClick={simpan} style={{width:'100%',padding:10,background:'#ea580c',border:'none',borderRadius:8,color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer'}}>💾 Simpan Item</button>
        </div>
      )}

      <div style={{display:'flex',flexDirection:'column',gap:5,marginTop:6}}>
        {menu.filter(m=>filterK==='Semua'||m.kat===filterK).map(item=>(
          <div key={item.id} style={{background:'#fff',borderRadius:10,padding:10,display:'flex',alignItems:'center',justifyContent:'space-between',border:'1px solid #e2e8f0',fontSize:12}}>
            <span>{item.emoji} <b>{item.nama}</b> (Rp {rp(item.harga)})</span>
            <button onClick={()=>{setForm({nama:item.nama,harga:String(item.harga),kat:item.kat,emoji:item.emoji});setEditId(item.id);setShowForm(true);}} style={{padding:'3px 8px',background:'#eff6ff',color:'#3b82f6',border:'none',borderRadius:6,cursor:'pointer',fontWeight:700}}>✏️ Edit</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══ TAB SETTING ═══ */
function TabSetting({namaWarung,setNamaWarung,alamatWarung,setAlamatWarung,telpWarung,setTelpWarung,setTransaksi,setPengeluaran,showMsg,proteksi}){
  const[nama,setNama]=useState(namaWarung);
  const[alamat,setAlamat]=useState(alamatWarung);
  const[telp,setTelp]=useState(telpWarung);

  const simpanInformasiProfil=()=>{
    setNamaWarung(nama);
    setAlamatWarung(alamat);
    setTelpWarung(telp);
    showMsg('✅ Profil Nota Toko Berhasil Diperbarui!');
  };

  const resetSemuaDataMemori=()=>{
    proteksi(() => {
      if(confirm('⚠️ PERINGATAN KRUSIAL! Anda akan menghapus total seluruh database penjualan?')){
        setTransaksi([]);
        setPengeluaran([]);
        showMsg('🗑️ Seluruh data memori kasir di-reset total!');
      }
    });
  };

  return(
    <div style={{padding:14,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{background:'#fff',borderRadius:14,padding:14,border:'1px solid #e2e8f0'}}>
        <div style={{fontWeight:800,fontSize:13,marginBottom:8}}>🏪 Identitas & Header Kertas Struk</div>
        
        <label style={{fontSize:10,color:'#94a3b8',fontWeight:700}}>NAMA WARUNG / TOKO</label>
        <input value={nama} onChange={e=>setNama(e.target.value)} placeholder="Nama Toko..."
          style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:13,outline:'none',marginBottom:8,marginTop:2}}/>
        
        <label style={{fontSize:10,color:'#94a3b8',fontWeight:700}}>ALAMAT WARUNG</label>
        <input value={alamat} onChange={e=>setAlamat(e.target.value)} placeholder="Contoh: Jl. Diponegoro No. 12 Magelang"
          style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:13,outline:'none',marginBottom:8,marginTop:2}}/>
        
        <label style={{fontSize:10,color:'#94a3b8',fontWeight:700}}>NOMOR TELEPON / WA</label>
        <input value={telp} onChange={e=>setTelp(e.target.value)} placeholder="Contoh: 08123456789"
          style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:13,outline:'none',marginBottom:10,marginTop:2}}/>

        <button onClick={simpanInformasiProfil} style={{width:'100%',padding:10,background:'#ea580c',border:'none',borderRadius:8,color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer'}}>
          💾 Simpan Identitas Nota
        </button>
      </div>

      <div style={{background:'#fff',borderRadius:14,padding:14,border:'1px solid #fecaca'}}>
        <div style={{fontWeight:800,fontSize:13,color:'#ef4444',marginBottom:6}}>⚠️ Reset Data Utama (Akses Khusus)</div>
        <button onClick={resetSemuaDataMemori}
          style={{width:'100%',padding:10,background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,color:'#ef4444',fontSize:12,fontWeight:700,cursor:'pointer'}}>
          🔒 Reset Total Semua Laporan Transaksi
        </button>
      </div>
    </div>
  );
}

ReactDOM.render(<React.StrictMode><App/></React.StrictMode>,document.getElementById('root'));
// ── INLINE SERVICE WORKER (tidak perlu file sw.js terpisah) ──
if ('serviceWorker' in navigator) {
  const SW_VERSION = 'kasir-v10';
  const swCode = `
const CACHE = '${SW_VERSION}';
const ASSETS = [
  'https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap',
  'https://unpkg.com/react@18/umd/react.production.min.js',
  'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
  'https://unpkg.com/@babel/standalone/babel.min.js',
];
self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(c => {
      return c.addAll(ASSETS).catch(() => {});
    }).then(() => self.skipWaiting())
  );
});
self.addEventListener('activate', e => {
  e.waitUntil(
    caches.keys().then(keys =>
      Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))
    ).then(() => self.clients.claim())
  );
});
self.addEventListener('fetch', e => {
  // Cache-first untuk CDN assets, network-first untuk halaman utama
  const url = e.request.url;
  if (url.includes('unpkg.com') || url.includes('fonts.googleapis') || url.includes('fonts.gstatic')) {
    e.respondWith(
      caches.match(e.request).then(cached => cached || fetch(e.request).then(res => {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
        return res;
      }))
    );
  } else {
    e.respondWith(
      fetch(e.request).catch(() => caches.match(e.request))
    );
  }
});
`;
  try {
    const blob = new Blob([swCode], {type: 'application/javascript'});
    const swUrl = URL.createObjectURL(blob);
    navigator.serviceWorker.register(swUrl, {scope: './'}).then(reg => {
      console.log('SW inline registered', reg.scope);
    }).catch(() => {
      // Blob SW tidak support di semua browser, fallback diam-diam
    });
  } catch(e) {}
}
</script>
