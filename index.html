/* ═══ ESC/POS CONTROLLER ═══ */
const ESC=0x1B,GS=0x1D;
function buildStruk(namaWarung,alamat,telp,trx){
  const W=32;
  const pad=(l,r)=>{const s=Math.max(1,W-String(l).length-String(r).length);return String(l)+' '.repeat(s)+String(r);};
  const chunks=[];
  const p=(...b)=>chunks.push(...b);
  p(new Uint8Array([ESC,0x40]));
  p(new Uint8Array([ESC,0x61,1]),new Uint8Array([ESC,0x45,1]),new Uint8Array([GS,0x21,0x00]));
  p(new TextEncoder().encode(namaWarung.substring(0,W)+'\n'));
  p(new Uint8Array([ESC,0x45,0])); 
  if(alamat) p(new TextEncoder().encode(alamat.substring(0,W)+'\n'));
  if(telp) p(new TextEncoder().encode(`Telp: ${telp.substring(0,20)}\n`));
  p(new TextEncoder().encode('-'.repeat(W)+'\n'));
  p(new Uint8Array([ESC,0x61,0])); 
  p(new TextEncoder().encode(`Tgl : ${trx.tgl}  Jam: ${trx.jam}\n`));
  p(new TextEncoder().encode(`No  : #${String(trx.id).slice(-5)}\n`));
  p(new TextEncoder().encode('-'.repeat(W)+'\n'));
  trx.items.forEach(i=>{
    p(new TextEncoder().encode(i.nama.substring(0,W)+'\n'));
    p(new TextEncoder().encode(pad(`  ${i.qty} x ${rp(i.harga)}`,rp(i.harga*i.qty))+'\n'));
  });
  p(new TextEncoder().encode('='.repeat(W)+'\n'));
  p(new TextEncoder().encode(pad('Subtotal:', 'Rp '+rp(trx.subtotal))+'\n'));
  if(trx.diskon > 0) p(new TextEncoder().encode(pad('Diskon:', '-Rp '+rp(trx.diskon))+'\n'));
  p(new Uint8Array([ESC,0x45,1]));
  p(new TextEncoder().encode(pad('TOTAL:', 'Rp '+rp(trx.total))+'\n'));
  p(new Uint8Array([ESC,0x45,0]));
  p(new TextEncoder().encode(pad(`Bayar (${trx.metode}):`, 'Rp '+rp(trx.bayar))+'\n'));
  p(new TextEncoder().encode(pad('Kembali:', 'Rp '+rp(trx.kembali))+'\n'));
  p(new TextEncoder().encode('-'.repeat(W)+'\n'));
  p(new Uint8Array([ESC,0x61,1]));
  p(new TextEncoder().encode('Terima kasih sudah mampir!\n\n\n'));
  p(new Uint8Array([ESC,0x64,4]));
  p(new Uint8Array([GS,0x56,0x41,0x10]));
  const total=chunks.reduce((s,c)=>s+c.length,0);
  const buf=new Uint8Array(total);let off=0;
  chunks.forEach(c=>{buf.set(c,off);off+=c.length;});
  return buf;
}

const BLE_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','0000e001-0000-1000-8000-00805f9b34fb','49535343-fe7d-4ae5-8fa9-9fafd205e455','6e400001-b5a3-f393-e0a9-e50e24dcca9e'];
class PrinterMgr{
  constructor(){this.dev=null;this.ch=null;this.mtu=100;}
  ok(){return!!this.ch;}
  async connect(){
    if(!navigator.bluetooth)throw new Error('Browser tidak mendukung Bluetooth.');
    
    const dev=await navigator.bluetooth.requestDevice({
      filters: [
        { namePrefix: 'EPPOS' },
        { namePrefix: 'RPP' },
        { namePrefix: 'Printer' },
        { namePrefix: 'MTP' },
        { namePrefix: 'PT' },
        { namePrefix: 'POS' },
        { namePrefix: 'Bluetooth' }
      ],
      optionalServices:BLE_SERVICES
    });
    
    const srv=await dev.gatt.connect();
    dev.addEventListener('gattserverdisconnected',()=>{this.dev=null;this.ch=null;});
    let ch=null;
    try{
      const svcs=await srv.getPrimaryServices();
      for(const s of svcs){try{const cs=await s.getCharacteristics();for(const c of cs){if(c.properties.write||c.properties.writeWithoutResponse){ch=c;break;}}if(ch)break;}catch{}}
    }catch{}
    if(!ch)throw new Error('Karakteristik printer tidak ditemukan.');
    this.dev=dev;this.ch=ch;
    return dev.name||'Printer BLE';
  }
  async send(buf){
    if(!this.ch)throw new Error('Printer belum terhubung');
    for(let i=0;i<buf.length;i+=this.mtu){
      const chunk=buf.slice(i,i+this.mtu);
      if(this.ch.properties.writeWithoutResponse)await this.ch.writeValueWithoutResponse(chunk);
      else await this.ch.writeValue(chunk);
      await new Promise(r=>setTimeout(r,20));
    }
  }
  async disconnect(){if(this.dev?.gatt?.connected)await this.dev.gatt.disconnect();this.dev=null;this.ch=null;}
}
const printer=new PrinterMgr();

function cetakCss(namaWarung,alamat,telp,trx){
  let h=`<div style="text-align:center;font-weight:bold;font-size:12px;margin-bottom:2px">${namaWarung}</div>`;
  if(alamat) h+=`<div style="text-align:center;font-size:9px;line-height:1.1">${alamat}</div>`;
  if(telp) h+=`<div style="text-align:center;font-size:9px;">Telp: ${telp}</div>`;
  h+=`<div>${'-'.repeat(32)}</div>`;
  h+=`<div style="font-size:10px">Tgl: ${trx.tgl}  Jam: ${trx.jam}</div>`;
  h+=`<div style="font-size:10px">No : #${String(trx.id).slice(-5)}</div>`;
  h+=`<div>${'-'.repeat(32)}</div>`;
  trx.items.forEach(i=>{
    h+=`<div style="font-size:11px">${i.nama}</div>`;
    h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span style="padding-left:8px">${i.qty} x ${rp(i.harga)}</span><span>${rp(i.harga*i.qty)}</span></div>`;
  });
  h+=`<div>${'='.repeat(32)}</div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span>Subtotal</span><span>Rp ${rp(trx.subtotal)}</span></div>`;
  if(trx.diskon > 0) h+=`<div style="display:flex;justify-content:space-between;font-size:11px;color:#000"><span>Diskon</span><span>-Rp ${rp(trx.diskon)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-weight:bold;font-size:11px"><span>TOTAL</span><span>Rp ${rp(trx.total)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span>Bayar (${trx.metode})</span><span>Rp ${rp(trx.bayar)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;font-size:11px"><span>Kembali</span><span>Rp ${rp(trx.kembali)}</span></div>`;
  h+=`<div>${'-'.repeat(32)}</div>`;
  h+=`<div style="text-align:center;font-size:10px">Terima kasih sudah mampir!</div><br><br><br>`;
  document.getElementById('struk-print').innerHTML=h;
  setTimeout(()=>window.print(),200);
}

function ls(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

/* ═══════════════ MAIN APP ═══════════════ */
function App(){
  const[tab,setTab]=useState('kasir');
  const[namaWarung,setNamaWarung]=useState(()=>localStorage.getItem('wg_nama_v10')||'Kedai Selada Air');
  const[alamatWarung,setAlamatWarung]=useState(()=>localStorage.getItem('wg_alamat_v10')||'');
  const[telpWarung,setTelpWarung]=useState(()=>localStorage.getItem('wg_telp_v10')||'');
  
  const[menu,setMenu]=useState(()=>ls('wg_menu_v10',MENU_DEFAULT));
  const[cart,setCart]=useState([]);
  const[transaksi,setTransaksi]=useState(()=>ls('wg_trx_v10',[]));
  const[pengeluaran,setPengeluaran]=useState(()=>ls('wg_pgl_v10',[]));
  
  const[bayar,setBayar]=useState('');
  const[diskonInput,setDiskonInput]=useState('');
  const[metodeBayar,setMetodeBayar]=useState('Cash'); 
  
  const[cartModal,setCartModal]=useState(null);
  const[toast,setToast]=useState('');
  const[printerSt,setPrinterSt]=useState('off');
  const toastRef=useRef();

  useEffect(()=>{lsSet('wg_menu_v10',menu);},[menu]);
  useEffect(()=>{lsSet('wg_trx_v10',transaksi);},[transaksi]);
  useEffect(()=>{lsSet('wg_pgl_v10',pengeluaran);},[pengeluaran]);
  useEffect(()=>{
    localStorage.setItem('wg_nama_v10',namaWarung);
    localStorage.setItem('wg_alamat_v10',alamatWarung);
    localStorage.setItem('wg_telp_v10',telpWarung);
  },[namaWarung,alamatWarung,telpWarung]);

  const showMsg=useCallback((m)=>{
    clearTimeout(toastRef.current);setToast(m);
    toastRef.current=setTimeout(()=>setToast(''),2800);
  },[]);

  const keCart=useCallback((item)=>setCart(p=>{
    const ada=p.find(i=>i.id===item.id);
    return ada?p.map(i=>i.id===item.id?{...i,qty:i.qty+1}:i):[...p,{...item,qty:1}];
  }),[]);
  
  const ubahQty=useCallback((id,d)=>setCart(p=>p.map(i=>i.id===id?{...i,qty:i.qty+d}:i).filter(i=>i.qty>0)),[]);
  
  const subtotalHarga=useMemo(()=>cart.reduce((s,i)=>s+i.harga*i.qty,0),[cart]);
  const totalQty=useMemo(()=>cart.reduce((s,i)=>s+i.qty,0),[cart]);

  const hitungDiskon=useMemo(()=> {
    if(!diskonInput) return 0;
    if(diskonInput.includes('%')) {
      const persen = parseFloat(diskonInput.replace('%','')) || 0;
      return Math.round((persen / 100) * subtotalHarga);
    }
    return parseInt(diskonInput) || 0;
  }, [diskonInput, subtotalHarga]);

  const totalHargaAkhir = useMemo(()=> Math.max(0, subtotalHarga - hitungDiskon), [subtotalHarga, hitungDiskon]);

  const hubungkanPrinter=async()=>{
    if(printerSt==='on'){await printer.disconnect();setPrinterSt('off');showMsg('🔌 Printer diputus');return;}
    setPrinterSt('connecting');showMsg('🔍 Mencari printer...');
    try{const nm=await printer.connect();setPrinterSt('on');showMsg('✅ '+nm+' terhubung!');}
    catch(e){setPrinterSt('off');showMsg('❌ '+e.message);}
  };

  const eksekusiBayar=async()=>{
    const nb=metodeBayar === 'QRIS' ? totalHargaAkhir : (parseInt(bayar)||0);
    if(nb < totalHargaAkhir){showMsg('⚠️ Uang bayar kurang!');return;}
    
    const trx={
      id:Date.now(),
      tgl:tgl(),
      jam:jam(),
      items:cart.map(i=>({...i})),
      subtotal:subtotalHarga,
      diskon:hitungDiskon,
      total:totalHargaAkhir,
      bayar:nb,
      kembali:nb-totalHargaAkhir,
      metode:metodeBayar
    };

    setTransaksi(p=>[trx,...p]);
    setCart([]);setCartModal(null);setBayar('');setDiskonInput('');setMetodeBayar('Cash');
    
    if(printer.ok()){
      try{await printer.send(buildStruk(namaWarung,alamatWarung,telpWarung,trx));showMsg('🖨️ Struk dicetak!');}
      catch(e){showMsg('⚠️ Cetak via browser');cetakCss(namaWarung,alamatWarung,telpWarung,trx);}
    }else{cetakCss(namaWarung,alamatWarung,telpWarung,trx);showMsg('✅ Transaksi sukses!');}
  };

  const verifikasiAksesAdmin=(aksiSukses)=>{
    const inputPin = prompt("🔒 Masukkan PIN Keamanan Owner/Admin untuk menghapus data:");
    if(inputPin === PIN_ADMIN){
      aksiSukses();
    }else if(inputPin !== null){
      alert("❌ PIN Salah! Akses ditolak.");
    }
  };

  const ulangCetak=(trx)=>{
    if(printer.ok()){printer.send(buildStruk(namaWarung,alamatWarung,telpWarung,trx)).catch(()=>cetakCss(namaWarung,alamatWarung,telpWarung,trx));}
    else cetakCss(namaWarung,alamatWarung,telpWarung,trx);
  };

  const btnP={off:{bg:'rgba(255,255,255,0.15)',lbl:'🔌 Printer'},connecting:{bg:'#f59e0b',lbl:'⏳...'},on:{bg:'#22c55e',lbl:'🖨️ ON'}}[printerSt] || {bg:'rgba(255,255,255,0.15)',lbl:'🔌 Printer'};

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      {/* HEADER */}
      <div style={{background:'linear-gradient(135deg,#ea580c,#c2410c)',padding:'12px 16px',color:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',flexShrink:0}}>
        <div>
          <div style={{fontSize:'16px',fontWeight:800,lineHeight:1.1}}>{namaWarung}</div>
          <div style={{fontSize:'10px',opacity:0.8,marginTop:2}}>{tgl()} · Sistem v10 Tab-Ready</div>
        </div>
        <button onClick={hubungkanPrinter} disabled={printerSt==='connecting'}
          style={{background:btnP.bg,border:'none',padding:'6px 12px',borderRadius:'20px',color:'#fff',fontSize:'11px',fontWeight:700,cursor:'pointer'}}>
          {btnP.lbl}
        </button>
      </div>

      {/* TAB NAVIGATION */}
      <div style={{display:'flex',background:'#fff',borderBottom:'1px solid #e2e8f0',flexShrink:0}}>
        {[{id:'kasir',l:'🍽️ Kasir'},{id:'laporan',l:'📊 Laporan'},{id:'menu',l:'📋 Menu'},{id:'setting',l:'⚙️ Pengaturan'}].map(t=>(
          <div key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'12px 4px',textAlign:'center',fontSize:'12px',fontWeight:700,cursor:'pointer',borderBottom:tab===t.id?'3px solid #ea580c':'3px solid transparent',color:tab===t.id?'#ea580c':'#94a3b8',transition:'all .15s'}}>
            {t.l}
          </div>
        ))}
      </div>

      {/* BODY CONTENT */}
      <div style={{flex:1,overflowY:'auto',position:'relative'}}>
        {tab==='kasir'&&<TabKasir menu={menu} cart={cart} keCart={keCart} ubahQty={ubahQty} totalHarga={totalHargaAkhir} subtotal={subtotalHarga} diskon={hitungDiskon} totalQty={totalQty} setCartModal={setCartModal}/>}
        {tab==='laporan'&&<TabLaporan transaksi={transaksi} setTransaksi={setTransaksi} pengeluaran={pengeluaran} setPengeluaran={setPengeluaran} ulangCetak={ulangCetak} showMsg={showMsg} proteksi={verifikasiAksesAdmin}/>}
        {tab==='menu'&&<TabMenu menu={menu} setMenu={setMenu} showMsg={showMsg}/>}
        {tab==='setting'&&<TabSetting namaWarung={namaWarung} setNamaWarung={setNamaWarung} alamatWarung={alamatWarung} setAlamatWarung={setAlamatWarung} telpWarung={telpWarung} setTelpWarung={setTelpWarung} transaksi={transaksi} setTransaksi={setTransaksi} pengeluaran={pengeluaran} setPengeluaran={setPengeluaran} showMsg={showMsg} proteksi={verifikasiAksesAdmin}/>}
      </div>

      {/* MODAL REVIEW ORDER */}
      {cartModal==='review'&&(

              <span style={{fontWeight:800,fontSize:15}}>💳 Selesaikan Transaksi</span>
              <div style={{display:'flex',gap:6}}>
                <button onClick={()=>setCartModal('review')} style={{background:'#f1f5f9',border:'none',borderRadius:20,padding:'5px 12px',cursor:'pointer',fontWeight:700,fontSize:11}}>← Kembali</button>
                <button onClick={()=>{setCartModal(null);setBayar('');setDiskonInput('');}} style={{background:'#f1f5f9',border:'none',borderRadius:20,padding:'5px 12px',cursor:'pointer',fontWeight:700,fontSize:11}}>✕</button>
              </div>
            </div>

            <div style={{background:'#f8fafc',borderRadius:12,padding:10,marginBottom:10,border:'1px solid #e2e8f0',fontSize:12}}>

                <span>Subtotal:</span><span>Rp {rp(subtotalHarga)}</span>

                <div style={{display:'flex',justifyContent:'space-between',marginBottom:4,color:'#dc2626',fontWeight:600}}>

            <label style={{fontSize:11,color:'#64748b',fontWeight:700,marginBottom:4}}>METODE PEMBAYARAN</label>

              {['Cash','QRIS'].map(m=>(
                <button key={m} onClick={()=>setMetodeBayar(m)} style={{flex:1,padding:'10px',borderRadius:10,fontWeight:800,fontSize:12,cursor:'pointer',border:metodeBayar===m?'2px solid #ea580c':'1px solid #e2e8f0',background:metodeBayar===m?'#fff7ed':'#fff',color:metodeBayar===m?'#ea580c':'#64748b'}}>

              ))}

            <label style={{fontSize:11,color:'#64748b',fontWeight:700,marginBottom:4}}>DISKON / POTONGAN (CONTOH: 10% ATAU 5000)</label>

                  <div style={{display:'flex',justifyContent:'space-between',color:'#16a34a',fontWeight:700,fontSize:12,padding:'8px 10px',background:'#f0fdf4',borderRadius:8,marginBottom:10}}>
                    <span>Kembalian Kasir:</span><span>Rp {rp(parseInt(bayar)-totalHargaAkhir)}</span>
                  </div>
                )}

            )}

            <button onClick={eksekusiBayar} style={{width:'100%',padding:'12px',background:'linear-gradient(135deg,#22c55e,#16a34a)',color:'#fff',border:'none',borderRadius:12,fontWeight:800,fontSize:13,cursor:'pointer'}}>

    </div>
  );
}

/* ═══ TAB KASIR (GRID KULINER RESPONSif TABLET & HP) ═══ */
function TabKasir({menu,cart,keCart,ubahQty,totalHarga,subtotal,diskon,totalQty,setCartModal}){
  const[kat,setKat]=useState('Semua');
  const[q,setQ]=useState('');
  const filtered=useMemo(()=>menu.filter(m=>(kat==='Semua'||m.kat===kat)&&m.nama.toLowerCase().includes(q.toLowerCase())),[menu,kat,q]);
  
  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
      <div style={{padding:'10px 14px 4px'}}>
        <div style={{display:'flex',alignItems:'center',background:'#fff',borderRadius:10,padding:'6px 12px',gap:8,border:'1px solid #e2e8f0'}}>
          <span>🔍</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Cari nama kuliner..." style={{border:'none',outline:'none',fontSize:12,fontFamily:'Plus Jakarta Sans',flex:1,fontWeight:600}}/>
        </div>
      </div>
      <div style={{display:'flex',gap:6,padding:'4px 14px 8px',overflowX:'auto',flexShrink:0}}>
        {KATEGORI.map(k=>(
          <button key={k} onClick={()=>setKat(k)} style={{padding:'5px 12px',borderRadius:16,border:'1px solid #e2e8f0',fontSize:11,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',background:kat===k?WARNA_KAT[k]||'#ea580c':'#fff',color:kat===k?'#fff':'#94a3b8'}}>
            {k}
          </button>
        ))}
      </div>

      {/* SEKARANG SUDAH AUTO-FILL: SANGAT COCOK DI TABLET, JADI BANYAK BARIS KOLOM */}
      <div style={{flex:1,overflowY:'auto',padding:'0 14px 80px',display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:10,alignContent:'start'}}>
        {filtered.map(m=>(
          <div key={m.id} onClick={()=>keCart(m)} style={{background:'#fff',borderRadius:14,padding:10,border:'1px solid #e2e8f0',position:'relative',cursor:'pointer',display:'flex',flexDirection:'column',justifyContent:'space-between',minHeight:95}}>
            <div style={{fontSize:22,marginBottom:4}}>{m.emoji}</div>
            <div>
              <div style={{fontSize:12,fontWeight:700,color:'#1e293b',lineHeight:1.2,marginBottom:2}}>{m.nama}</div>
              <div style={{fontSize:11,fontWeight:800,color:'#ea580c'}}>Rp {rp(m.harga)}</div>
            </div>
            {cart.find(i=>i.id===m.id)&&(
              <div style={{position:'absolute',top:8,right:8,background:'#ea580c',color:'#fff',fontSize:10,fontWeight:800,width:18,height:18,borderRadius:9,display:'flex',alignItems:'center',justifyContent:'center'}}>
                {cart.find(i=>i.id===m.id).qty}
              </div>
            )}
          </div>
        ))}
      </div>

      {totalQty > 0 && (
        <div style={{position:'absolute',bottom:0,left:0,right:0,background:'linear-gradient(to top,rgba(248,250,252,1) 70%,rgba(248,250,252,0))',padding:'10px 14px 16px',zIndex:10}}>
          <button onClick={()=>setCartModal('review')} style={{width:'100%',padding:12,background:'linear-gradient(135deg,#ea580c,#c2410c)',color:'#fff',border:'none',borderRadius:12,fontWeight:800,fontSize:13,display:'flex',justifyContent:'space-between',alignItems:'center',boxShadow:'0 10px 15px -3px rgba(234,88,12,0.3)',cursor:'pointer'}}>
            <span>🛒 Meja ({totalQty} Item)</span>
            <span style={{background:'rgba(255,255,255,0.2)',padding:'2px 8px',borderRadius:8}}>Rp {rp(totalHarga)} ➔</span>
          </button>
        </div>
      )}
    </div>
  );
}

/* ═══ TAB LAPORAN ═══ */
function TabLaporan({transaksi,setTransaksi,pengeluaran,setPengeluaran,ulangCetak,showMsg,proteksi}){
  const[subTab,setSubTab]=useState('pendapatan');
  const[pLabel,setPLabel]=useState('');
  const[pNominal,setPNominal]=useState('');

  const ttlMasuk = useMemo(()=>transaksi.reduce((s,t)=>s+t.total,0),[transaksi]);
  const ttlKeluar = useMemo(()=>pengeluaran.reduce((s,p)=>s+p.nominal,0),[pengeluaran]);

  const tambahPengeluaran=()=>{
    if(!pLabel||!pNominal) return;
    const item={id:Date.now(),tgl:tgl(),jam:jam(),label:pLabel,nominal:parseInt(pNominal)||0};
    setPengeluaran(p=>[item,...p]);
    setPLabel('');setPNominal('');showMsg('📉 Pengeluaran dicatat');
  };

  return(
    <div style={{padding:14,paddingBottom:40}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10,marginBottom:14}}>
        <div style={{background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:14,padding:12}}>
          <div style={{fontSize:10,fontWeight:700,color:'#16a34a'}}>TOTAL OMSET</div>
          <div style={{fontSize:15,fontWeight:800,color:'#15803d',marginTop:2}}>Rp {rp(ttlMasuk)}</div>
        </div>
        <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:14,padding:12}}>
          <div style={{fontSize:10,fontWeight:700,color:'#dc2626'}}>TOTAL PENGELUARAN</div>
          <div style={{fontSize:15,fontWeight:800,color:'#b91c1c',marginTop:2}}>Rp {rp(ttlKeluar)}</div>
        </div>
      </div>

      <div style={{display:'flex',background:'#f1f5f9',borderRadius:10,padding:3,marginBottom:12}}>
        <button onClick={()=>setSubTab('pendapatan')} style={{flex:1,padding:6,borderRadius:8,border:'none',fontSize:11,fontWeight:700,cursor:'pointer',background:subTab==='pendapatan'?'#fff':'transparent',color:subTab==='pendapatan'?'#ea580c':'#64748b'}}>📊 Trx Masuk</button>
        <button onClick={()=>setSubTab('pengeluaran')} style={{flex:1,padding:6,borderRadius:8,border:'none',fontSize:11,fontWeight:700,cursor:'pointer',background:subTab==='pengeluaran'?'#fff':'transparent',color:subTab==='pengeluaran'?'#ea580c':'#64748b'}}>📉 Pengeluaran</button>
      </div>

      {subTab==='pendapatan'?(
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          {transaksi.length===0?<div style={{textAlign:'center',padding:20,fontSize:12,color:'#94a3b8'}}>Belum ada transaksi hari ini</div>:
            transaksi.map(t=>(
              <div key={t.id} style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,padding:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:11,color:'#64748b'}}>{t.jam} · No #{String(t.id).slice(-5)} <span style={{background:'#e0f2fe',color:'#0369a1',padding:'1px 4px',borderRadius:4,fontSize:9,fontWeight:700}}>{t.metode}</span></div>
                  <div style={{fontSize:11,fontWeight:700,marginTop:2,color:'#334155'}}>{t.items.map(i=>`${i.nama} (${i.qty})`).join(', ')}</div>
                  <div style={{fontSize:12,fontWeight:800,color:'#ea580c',marginTop:2}}>Rp {rp(t.total)}</div>
                </div>
                <div style={{display:'flex',gap:4}}>
                  <button onClick={()=>ulangCetak(t)} style={{padding:6,background:'#f1f5f9',border:'none',borderRadius:8,cursor:'pointer'}}>🖨️</button>
                  <button onClick={()=>proteksi(()=>setTransaksi(p=>p.filter(x=>x.id!==t.id)))} style={{padding:6,background:'#fef2f2',border:'none',borderRadius:8,color:'#ef4444',cursor:'pointer'}}>🗑️</button>
                </div>
              </div>
            ))
          }
        </div>
      ):(
        <div>
          <div style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:14,padding:12,marginBottom:12}}>
            <div style={{fontWeight:800,fontSize:12,marginBottom:6}}>Catat Pengeluaran Baru</div>
            <input value={pLabel} onChange={e=>setPLabel(e.target.value)} placeholder="Nama keperluan (ex: Beli Es Batu)..." style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none',marginBottom:6}}/>
            <input type="number" value={pNominal} onChange={e=>setPNominal(e.target.value)} placeholder="Nominal Biaya (Rp)..." style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none',marginBottom:8}}/>
            <button onClick={tambahPengeluaran} style={{width:'100%',padding:8,background:'#ea580c',border:'none',color:'#fff',borderRadius:8,fontSize:12,fontWeight:700,cursor:'pointer'}}>Simpan Pengeluaran</button>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {pengeluaran.map(p=>(
              <div key={p.id} style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,padding:10,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{fontSize:11,color:'#64748b'}}>{p.jam} - Pengeluaran</div>
                  <div style={{fontSize:12,fontWeight:700,color:'#334155'}}>{p.label}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:8}}>
                  <span style={{fontSize:12,fontWeight:800,color:'#dc2626'}}>Rp {rp(p.nominal)}</span>
                  <button onClick={()=>proteksi(()=>setPengeluaran(x=>x.filter(i=>i.id!==p.id)))} style={{border:'none',background:'transparent',color:'#ef4444',cursor:'pointer',fontSize:12}}>🗑️</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══ TAB KULINER/MENU MGR ═══ */
function TabMenu({menu,setMenu,showMsg}){
  const[nNama,setNNama]=useState('');
  const[nHarga,setNHarga]=useState('');
  const[nKat,setNKat]=useState('Nasi');
  const[nEmoji,setNEmoji]=useState('🍗');

  const tambahMenu=()=>{
    if(!nNama||!nHarga) return;
    const item={id:Date.now(),nama:nNama,harga:parseInt(nHarga)||0,kat:nKat,emoji:nEmoji};
    setMenu(p=>[...p,item]);
    setNNama('');setNHarga('');showMsg('✅ Menu baru ditambahkan');
  };

  return(
    <div style={{padding:14,paddingBottom:40}}>
      <div style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:14,padding:12,marginBottom:14}}>
        <div style={{fontWeight:800,fontSize:13,marginBottom:8,color:'#ea580c'}}>➕ Tambah Item Kuliner Baru</div>
        <div style={{display:'flex',gap:6,marginBottom:6}}>
          <select value={nEmoji} onChange={e=>setNEmoji(e.target.value)} style={{padding:8,borderRadius:8,border:'1px solid #e2e8f0',fontSize:16}} >
            {EMOJI_LIST.map(em=><option key={em} value={em}>{em}</option>)}
          </select>
          <input value={nNama} onChange={e=>setNNama(e.target.value)} placeholder="Nama Kuliner..." style={{flex:1,padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none'}}/>
        </div>
        <div style={{display:'flex',gap:6,marginBottom:8}}>
          <select value={nKat} onChange={e=>setNKat(e.target.value)} style={{flex:1,padding:8,borderRadius:8,border:'1px solid #e2e8f0',fontSize:12}} >
            {KATEGORI.filter(x=>x!=='Semua').map(k=><option key={k} value={k}>{k}</option>)}
          </select>
          <input type="number" value={nHarga} onChange={e=>setNHarga(e.target.value)} placeholder="Harga Jual Rp..." style={{flex:1,padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:12,outline:'none'}}/>
        </div>
        <button onClick={tambahMenu} style={{width:'100%',padding:10,background:'linear-gradient(135deg,#ea580c,#c2410c)',border:'none',color:'#fff',borderRadius:8,fontSize:12,fontWeight:800,cursor:'pointer'}}>💾 Daftarkan Menu</button>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {menu.map(m=>(
          <div key={m.id} style={{background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,padding:'8px 12px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <span style={{fontSize:18}}>{m.emoji}</span>
              <div>
                <div style={{fontSize:12,fontWeight:700}}>{m.nama}</div>
                <div style={{fontSize:10,color:'#94a3b8'}}>{m.kat} · Rp {rp(m.harga)}</div>
              </div>
            </div>
            <button onClick={()=>setMenu(p=>p.filter(x=>x.id!==m.id))} style={{border:'none',background:'transparent',color:'#ef4444',fontSize:12,cursor:'pointer',padding:4}}>🗑️</button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══ TAB PENGATURAN (SINKRON VARIABEL) ═══ */
function TabSetting({namaWarung,setNamaWarung,alamatWarung,setAlamatWarung,telpWarung,setTelpWarung,transaksi,setTransaksi,pengeluaran,setPengeluaran,showMsg,proteksi}){
  const[nama,setNama]=useState(namaWarung);
  const[alamat,setAlamat]=useState(alamatWarung);
  const[telp,setTelp]=useState(telpWarung);

  const simpanInformasiProfil=()=>{
    setNamaWarung(nama);
    setAlamatWarung(alamat);
    setTelpWarung(telp);
    showMsg('💾 Identitas Nota Diperbarui!');
  };

  const resetSemuaDataMemori=()=>{
    proteksi(()=>{
      setTransaksi([]);
      setPengeluaran([]);
      localStorage.removeItem('wg_trx_v10');
      localStorage.removeItem('wg_pgl_v10');
      showMsg('🗑️ Reset Sukses!');
    });
  };

  return(
    <div style={{padding:14,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{background:'#fff',borderRadius:14,padding:14,border:'1px solid #e2e8f0'}}>
        <div style={{fontWeight:800,fontSize:13,color:'#ea580c',marginBottom:8}}>🏢 Identitas Profile Toko / Nota</div>
        
        <label style={{fontSize:10,color:'#94a3b8',fontWeight:700}}>NAMA WARUNG / KEDAI</label>
        <input value={nama} onChange={e=>setNama(e.target.value)} placeholder="Contoh: Kedai Selada Air"
          style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:13,outline:'none',marginBottom:8,marginTop:2}}/>
        
        <label style={{fontSize:10,color:'#94a3b8',fontWeight:700}}>ALAMAT WARUNG</label>
        <input value={alamat} onChange={e=>setAlamat(e.target.value)} placeholder="Contoh: Jl. Ahmad Yani No. 12 Magelang"
          style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:13,outline:'none',marginBottom:8,marginTop:2}}/>
        
        <label style={{fontSize:10,color:'#94a3b8',fontWeight:700}}>NOMOR TELEPON / WA</label>
        <input value={telp} onChange={e=>setTelp(e.target.value)} placeholder="Contoh: 08123456789"
          style={{width:'100%',padding:8,border:'1px solid #e2e8f0',borderRadius:8,fontSize:13,outline:'none',marginBottom:10,marginTop:2}}/>

        <button onClick={simpanInformasiProfil} style={{width:'100%',padding:10,background:'#ea580c',border:'none',borderRadius:8,color:'#fff',fontSize:12,fontWeight:800,cursor:'pointer'}}>
          💾 Simpan Identitas Nota
        </button>
      </div>

      <div style={{background:'#fff',borderRadius:14,padding:14,border:'1px solid #fecaca'}}>
        <div style={{fontWeight:800,fontSize:13,color:'#ef4444',marginBottom:6}}>⚠️ Reset Data Utama (Akses Khusus)</div>
        <button onClick={resetSemuaDataMemori}
          style={{width:'100%',padding:10,background:'#fef2f2',border:'1px solid #fecaca',borderRadius:8,color:'#ef4444',fontSize:12,fontWeight:700,cursor:'pointer'}}>
          🔒 Reset Total Semua Laporan Transaksi
        </button>
      </div>
    </div>
  );
}

const container = document.getElementById('root');
if (React.createRoot) {
  React.createRoot(container).render(<App />);
} else {
  ReactDOM.render(<App />, container);
}

// REGISTER OFFLINE (PWA): Relatif ke folder repositori /kasir/ Bapak
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('Offline system active under scope:', reg.scope))
      .catch(err => console.error('Offline system failed to initialize:', err));
  });
}
</script>
</body>
</html>
